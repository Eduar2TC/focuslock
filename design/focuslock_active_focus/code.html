t: '600' }] } } } };</script></head><body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container pt-safe pb-safe"><div class="flex justify-between items-center px-margin-mobile h-6 text-on-surface-variant font-label-md opacity-40"><span class="tracking-normal">09:41</span><div class="flex items-center gap-space-xs"><span class="material-symbols-outlined text-[14px]">wifi</span><span class="material-symbols-outlined text-[14px]">battery_full</span></div></div><main class="flex-1 flex flex-col relative w-full bg-surface px-margin-mobile"><div class="flex flex-col w-full pb-space-2xl">
<!-- Minimal Ambient Aura & Focus Canvas -->
<div class="relative w-full flex flex-col items-center justify-between min-h-[640px] px-space-xs">
<!-- Top Meta Status: Mode & Cycle Indicator -->
<div class="w-full flex justify-center pt-space-xs">
<div class="inline-flex items-center gap-space-xs px-space-md py-space-xxs rounded-full bg-surface-container-high/80 backdrop-blur-md shadow-sm">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
</span>
<span class="font-label-sm text-label-sm tracking-widest uppercase text-primary font-semibold">STRICT FOCUS</span>
<span class="text-outline text-label-sm">•</span>
<span class="font-label-sm text-label-sm tracking-wider uppercase text-on-surface-variant font-medium">CYCLE 2 OF 4</span>
</div>
</div>
<!-- Centerpiece: Circular Timer with Integrated Brand Crest Geometry -->
<div class="relative flex flex-col items-center justify-center my-auto py-space-md">
<!-- Ambient Glow Behind Timer Ring -->
<div class="absolute w-64 h-64 rounded-full bg-primary/5 blur-3xl pointer-events-none"></div>
<div class="relative w-[304px] h-[304px] flex items-center justify-center">
<!-- SVG Radial Progress Ring -->
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 320 320">
<!-- Ambient Track Background -->
<circle class="text-surface-container-high opacity-60" cx="160" cy="160" fill="transparent" r="140" stroke="currentColor" stroke-width="7"></circle>
<!-- Active Remaining Progress: 75% stroke-dashoffset = 2 * PI * 140 * 0.25 ≈ 220 -->
<circle class="transition-all duration-1000 ease-out" cx="160" cy="160" fill="transparent" id="focusProgressRing" r="140" stroke="#10B981" stroke-dasharray="879.64" stroke-dashoffset="220" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<!-- Inner Content: Lock Crest & Giant Monolithic Numbers -->
<div class="absolute inset-0 flex flex-col items-center justify-center text-center select-none">
<!-- Minimal Focus Lock Geometric Icon -->
<div class="mb-space-xxs flex items-center justify-center text-primary opacity-90 transition-transform duration-300 hover:scale-105">
<svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<rect height="10" rx="3" width="14" x="5" y="11"></rect>
<path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
<circle cx="12" cy="16" fill="currentColor" r="1.2"></circle>
</svg>
</div>
<!-- Giant Glanceable Timer Readout -->
<div class="flex items-baseline justify-center tracking-tighter">
<span class="font-display-hero text-display-hero text-on-surface tabular-nums font-semibold tracking-tight leading-none" id="timerDisplay" style="font-size: 76px; line-height: 80px;">24:37</span>
</div>
<!-- Micro Pulse Indicator -->
<div class="mt-space-xs flex items-center gap-space-xxs text-on-surface-variant font-label-sm text-label-sm tracking-widest uppercase">
<span class="material-symbols-outlined text-[13px] text-primary" style="font-variation-settings: 'FILL' 1;">lock</span>
<span>RESTRICTED MODE</span>
</div>
</div>
</div>
</div>
<!-- Context & Calming Guidance -->
<div class="w-full flex flex-col items-center text-center max-w-xs mx-auto space-y-space-sm mb-space-xl">
<!-- Task Goal -->
<div class="space-y-space-xxs">
<p class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight">
          Build my Flutter application
        </p>
<div class="flex items-center justify-center gap-space-xs text-on-surface-variant font-body-sm text-body-sm">
<span class="material-symbols-outlined text-[15px] text-secondary">verified_user</span>
<span>Phone is locked down • 6 apps blocked</span>
</div>
</div>
<!-- Zen Mantra Pill Card -->
<div class="w-full px-space-md py-space-sm rounded-xl bg-surface-container-low shadow-sm flex items-center justify-center gap-space-xs">
<span class="material-symbols-outlined text-[16px] text-tertiary">spa</span>
<p class="font-body-sm text-body-sm text-on-surface-variant italic">
          Put your phone down and dive in.
        </p>
</div>
</div>
<!-- Ergonomic Thumb Bottom Controls -->
<div class="w-full flex flex-col items-center gap-space-sm max-w-sm mx-auto">
<!-- Primary Action: Calm Dark Pill Button -->
<button class="w-full h-14 rounded-full bg-surface-container-high hover:bg-surface-bright active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-space-xs px-space-xl text-on-surface font-label-lg text-label-lg shadow-md focus:outline-none" id="pauseResumeBtn" type="button">
<span class="material-symbols-outlined text-[20px] text-primary" id="pauseIcon" style="font-variation-settings: 'FILL' 1;">pause</span>
<span class="tracking-wide" id="pauseLabel">Pause Session</span>
</button>
<!-- Secondary Ghost Option: End Session Confirm Trigger -->
<button class="h-10 px-space-md rounded-full text-outline hover:text-error active:text-error transition-colors duration-200 flex items-center justify-center gap-space-xxs font-label-md text-label-md focus:outline-none" id="endSessionBtn" type="button">
<span class="material-symbols-outlined text-[15px]">power_settings_new</span>
<span>End session early</span>
</button>
</div>
<!-- Hidden Interactive Confirmation Modal for Session Abort -->
<div class="hidden absolute inset-0 z-20 flex flex-col justify-end p-space-sm backdrop-blur-md bg-surface-dim/80 transition-opacity duration-200" id="confirmModal">
<div class="w-full p-space-lg rounded-2xl bg-surface-container-high shadow-xl flex flex-col gap-space-md">
<div class="flex items-center gap-space-sm">
<div class="w-10 h-10 rounded-full bg-error-container/40 text-error flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">warning</span>
</div>
<div class="flex flex-col">
<h4 class="font-headline-sm text-headline-sm text-on-surface font-semibold">Break Focus Session?</h4>
<p class="font-body-sm text-body-sm text-on-surface-variant">Your current streak will reset for today.</p>
</div>
</div>
<div class="flex items-center gap-space-sm pt-space-xs">
<button class="flex-1 h-12 rounded-full bg-surface-variant hover:bg-surface-bright text-on-surface font-label-lg text-label-lg flex items-center justify-center" id="cancelQuitBtn" type="button">
            Keep Focusing
          </button>
<button class="flex-1 h-12 rounded-full bg-error-container text-on-error-container hover:opacity-90 active:scale-95 transition-transform font-label-lg text-label-lg flex items-center justify-center" id="confirmQuitBtn" type="button">
            Unlock Phone
          </button>
</div>
</div>
</div>
</div>
</div>
<script>
  (function initFocusScreen() {
    let isPaused = false;
    let secondsRemaining = 24 * 60 + 37; // 24:37
    const totalDuration = 32 * 60 + 50; // Total 32m 50s session baseline (75% remaining)
    const maxOffset = 879.64; // Circumference of 2 * PI * 140

    const display = document.getElementById('timerDisplay');
    const ring = document.getElementById('focusProgressRing');
    const pauseBtn = document.getElementById('pauseResumeBtn');
    const pauseIcon = document.getElementById('pauseIcon');
    const pauseLabel = document.getElementById('pauseLabel');
    const endSessionBtn = document.getElementById('endSessionBtn');
    const confirmModal = document.getElementById('confirmModal');
    const cancelQuitBtn = document.getElementById('cancelQuitBtn');
    const confirmQuitBtn = document.getElementById('confirmQuitBtn');

    function formatTime(totalSec) {
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function updateDisplay() {
      if (display) {
        display.textContent = formatTime(secondsRemaining);
      }
      if (ring) {
        const fractionLeft = secondsRemaining / totalDuration;
        const newOffset = maxOffset * (1 - fractionLeft);
        ring.style.strokeDashoffset = newOffset.toFixed(2);
      }
    }

    const timerInterval = setInterval(() => {
      if (!isPaused && secondsRemaining > 0) {
        secondsRemaining--;
        updateDisplay();
      }
    }, 1000);

    if (pauseBtn) {
      pauseBtn.addEventListener('click', () => {
        isPaused = !isPaused;
        if (isPaused) {
          pauseIcon.textContent = 'play_arrow';
          pauseLabel.textContent = 'Resume Focus';
          pauseBtn.classList.add('bg-primary-container', 'text-on-primary-container');
          pauseBtn.classList.remove('bg-surface-container-high', 'text-on-surface');
          pauseIcon.classList.remove('text-primary');
          pauseIcon.classList.add('text-on-primary-container');
        } else {
          pauseIcon.textContent = 'pause';
          pauseLabel.textContent = 'Pause Session';
          pauseBtn.classList.remove('bg-primary-container', 'text-on-primary-container');
          pauseBtn.classList.add('bg-surface-container-high', 'text-on-surface');
          pauseIcon.classList.add('text-primary');
          pauseIcon.classList.remove('text-on-primary-container');
        }
      });
    }

    if (endSessionBtn && confirmModal) {
      endSessionBtn.addEventListener('click', () => {
        confirmModal.classList.remove('hidden');
      });
    }

    if (cancelQuitBtn && confirmModal) {
      cancelQuitBtn.addEventListener('click', () => {
        confirmModal.classList.add('hidden');
      });
    }

    if (confirmQuitBtn && confirmModal) {
      confirmQuitBtn.addEventListener('click', () => {
        confirmModal.classList.add('hidden');
        isPaused = true;
        secondsRemaining = 0;
        updateDisplay();
        if (pauseLabel) pauseLabel.textContent = 'Session Finished';
        if (pauseBtn) pauseBtn.disabled = true;
      });
    }
  })();
</script></main></body></html>
