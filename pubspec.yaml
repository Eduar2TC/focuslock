name: focuslock
description: FocusLock - Concentration enforcement system
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  go_router: ^14.2.0
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  path: ^1.8.3
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  drift_dev: ^2.18.0
  mockito: ^5.4.4
  analyzer: ^6.4.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: false
  remove_alpha_ios: true
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#1A232A"
  adaptive_icon_foreground: assets/brand/app_icon_foreground.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#121316"
  image: assets/brand/splash.png
  android: true
  ios: false
  android_12:
    color: "#121316"
    image: assets/brand/splash.png

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
